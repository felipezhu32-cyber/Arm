name: redroid
on:
  workflow_dispatch:
jobs:
  redroid:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Arrancar Redroid (Android arm64)
        run: |
          set -x
          sudo apt-get update -qq
          sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" android-tools-adb
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || sudo modprobe binder_linux
          docker --version
          mkdir -p $PWD/rrdata
          docker run -d --rm --privileged --name redroid \
            -v $PWD/rrdata:/data -p 5555:5555 \
            redroid/redroid:11.0.0-latest \
            androidboot.redroid_gpu_mode=guest androidboot.hardware.egl=swiftshader
          echo "esperando arranque..."
          adb connect localhost:5555 || true
          for i in $(seq 1 24); do
            adb connect localhost:5555 >/dev/null 2>&1 || true
            b=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            echo "intento $i: boot_completed=$b"
            [ "$b" = "1" ] && break
            sleep 10
          done
          echo "=== estado final ==="
          adb devices
          adb shell getprop ro.product.cpu.abi 2>&1
          adb shell getprop ro.build.version.release 2>&1
          echo "=== logs redroid (por si falla) ==="
          docker logs redroid 2>&1 | tail -25
